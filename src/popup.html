<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Arxiv PDF Translate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header>
      <span class="logo"><img class="logo-icon" src="../icons/logo.svg" alt=""><img class="logo-wordmark" src="../icons/arxiv_pdf_translate.svg" alt="Arxiv PDF Translate"></span>
      <span id="serverStatus" class="status-icon checking" title="检测本机服务…" aria-label="检测本机服务…">
        <svg class="icon-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <svg class="icon-unlink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/><path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"/><line x1="8" x2="8" y1="2" y2="5"/><line x1="2" x2="5" y1="8" y2="8"/><line x1="16" x2="16" y1="19" y2="22"/><line x1="19" x2="22" y1="16" y2="16"/></svg>
      </span>
    </header>

    <section id="connSection" class="conn" hidden>
      <div class="conn-head">
        <span class="conn-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 5 3-3"/><path d="m2 22 3-3"/><path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"/><path d="M7.5 13.5 10 11"/><path d="M10.5 16.5 13 14"/><path d="m12 6 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0L12 6Z"/></svg>
        </span>
        <div class="conn-text">
          <div class="conn-title">未连接到本机服务</div>
          <div class="conn-sub">请先启动本机服务（双击启动器或托盘图标 → 启动服务）；地址需与 server/config.json 的端口一致。</div>
        </div>
      </div>
      <input id="serverUrlInput" type="text" placeholder="http://127.0.0.1:18760" spellcheck="false">
      <button id="recheckBtn" class="primary">重新检测</button>
      <div id="connResult" class="hint"></div>
    </section>

    <div id="translateSection">
      <div id="existingSection" class="existing" hidden>
        <div class="section-title">已翻译过</div>
        <div id="existingList" class="existing-list"></div>
      </div>

      <div class="section-title">翻译选项</div>
      <div class="opts">
        <div class="lang-pair">
          <select id="sourceLang" title="源语言"></select>
          <span class="lang-arrow">→</span>
          <select id="targetLang" title="目标语言"></select>
        </div>
        <div class="row">
          <label for="pageMode">翻译范围</label>
          <select id="pageMode">
            <option value="all">全部页面</option>
            <option value="first">第一页</option>
            <option value="first5">前 5 页</option>
            <option value="custom">自定义页码</option>
          </select>
        </div>
        <div class="row" id="customPagesRow">
          <label for="customPages">自定义页码</label>
          <input id="customPages" type="text" placeholder="例如 1,3,5-8">
        </div>
        <label class="check">
          <input id="ignoreCache" type="checkbox">
          <span>忽略缓存，强制重新翻译</span>
        </label>
      </div>

      <button id="translate" class="primary" disabled>开始翻译</button>
      <button id="openOptions" class="ghost">设置</button>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
